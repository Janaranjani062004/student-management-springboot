<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="container mt-4">

<h3 class="mb-3">Student Management</h3>

<div class="card p-3 mb-4">
    <form onsubmit="event.preventDefault(); saveStudent();">

        <input
            type="hidden"
            id="studentId"
            autocomplete="off"
        >

        <div class="mb-2">
            <label for="name" class="form-label">Name</label>
            <input
                type="text"
                id="name"
                class="form-control form-control-sm"
                autocomplete="name"
                required
            >
        </div>

        <div class="mb-2">
            <label for="email" class="form-label">Email</label>
            <input
                type="email"
                id="email"
                class="form-control form-control-sm"
                autocomplete="email"
                required
            >
        </div>

        <div class="mb-3">
            <label for="age" class="form-label">Age</label>
            <input
                type="number"
                id="age"
                class="form-control form-control-sm"
                autocomplete="off"
                required
            >
        </div>

        <div class="d-flex gap-2">
            <button
                id="saveBtn"
                type="submit"
                class="btn btn-success btn-sm"
            >
                Add Student
            </button>

            <button
                type="button"
                class="btn btn-secondary btn-sm"
                onclick="clearForm()"
            >
                Clear
            </button>
        </div>

    </form>
</div>

<table class="table table-bordered table-sm">
    <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Age</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody id="studentTable"></tbody>
</table>

<nav>
    <ul class="pagination pagination-sm" id="pagination"></ul>
</nav>

<script>
/* ================= CONFIG ================= */
const BASE_URL = "/api/student";
let currentPage = 0;
const pageSize = 5;

/* ================= LOAD ================= */
function loadStudents(page = 0) {
    currentPage = page;

    fetch(`${BASE_URL}?page=${page}&size=${pageSize}`)
        .then(res => {
            if (!res.ok) throw new Error("Failed to load students");
            return res.json();
        })
        .then(data => {
            renderTable(data.content || []);
            renderPagination(data.totalPages || 0);
        })
        .catch(err => {
            console.error(err);
            alert("Error loading students");
        });
}

/* ================= TABLE ================= */
function renderTable(data) {
    const table = document.getElementById("studentTable");

    if (!data.length) {
        table.innerHTML =
            `<tr><td colspan="5" class="text-center">No students</td></tr>`;
        return;
    }

    table.innerHTML = data.map(s => `
        <tr>
            <td>${s.id}</td>
            <td>${s.name}</td>
            <td>${s.email}</td>
            <td>${s.age}</td>
            <td>
                <button class="btn btn-warning btn-sm"
                    onclick="editStudent(${s.id})">Edit</button>
                <button class="btn btn-danger btn-sm"
                    onclick="deleteStudent(${s.id})">Delete</button>
            </td>
        </tr>
    `).join("");
}

/* ================= PAGINATION ================= */
function renderPagination(totalPages) {
    const pagination = document.getElementById("pagination");
    pagination.innerHTML = "";

    for (let i = 0; i < totalPages; i++) {
        pagination.innerHTML += `
            <li class="page-item ${i === currentPage ? "active" : ""}">
                <button class="page-link"
                    onclick="loadStudents(${i})">${i + 1}</button>
            </li>
        `;
    }
}

/* ================= SAVE / UPDATE ================= */
function saveStudent() {
    const id = document.getElementById("studentId").value;
    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    const age = document.getElementById("age").value;

    if (!name || !email || !age) {
        alert("Please fill all fields");
        return;
    }

    const student = {
        name,
        email,
        age: Number(age)
    };

    let url = BASE_URL;
    let method = "POST";

    if (id) {
        url = `${BASE_URL}/${id}`;
        method = "PUT";
    }

    fetch(url, {
        method,
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(student)
    })
    .then(res => {
        if (!res.ok) throw new Error("Save failed");
        return res.json();
    })
    .then(() => {
        clearForm();
        loadStudents(0);
    })
    .catch(err => {
        console.error(err);
        alert("Save failed");
    });
}

/* ================= EDIT ================= */
function editStudent(id) {
    fetch(`${BASE_URL}/${id}`)
        .then(res => res.json())
        .then(s => {
            document.getElementById("studentId").value = s.id;
            document.getElementById("name").value = s.name;
            document.getElementById("email").value = s.email;
            document.getElementById("age").value = s.age;

            const btn = document.getElementById("saveBtn");
            btn.innerText = "Update Student";
            btn.className = "btn btn-primary btn-sm";
        });
}

/* ================= DELETE ================= */
function deleteStudent(id) {
    if (!confirm("Delete student?")) return;

    fetch(`${BASE_URL}/${id}`, { method: "DELETE" })
        .then(() => loadStudents(currentPage));
}

/* ================= CLEAR ================= */
function clearForm() {
    document.getElementById("studentId").value = "";
    document.getElementById("name").value = "";
    document.getElementById("email").value = "";
    document.getElementById("age").value = "";

    const btn = document.getElementById("saveBtn");
    btn.innerText = "Add Student";
    btn.className = "btn btn-success btn-sm";
}

/* ================= INIT ================= */
loadStudents(0);
</script>

</body>
</html>
